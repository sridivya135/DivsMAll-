# Optional: local MySQL for Div's Mall.
# Copy backend/.env.example to backend/.env first, then set USE_SQLITE=false and
# match DB_* values with the variables below.
services:
  mysql:
    image: mysql:8.0
    container_name: divsmall-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-divs_mall}
      MYSQL_USER: ${DB_USER:-divs_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-divs_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
